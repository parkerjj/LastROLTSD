name = "lastroweb"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/making-cookie", "/lastro/presence", "/api/*"]

# Workers Cache is off by default; production enables it per-environment below.
[cache]
enabled = false

[vars]
ENVIRONMENT = "local"
MYSQL_CONNECTION_MODE = "direct"
BUILD_VERSION = "dev"
MAX_BODY_BYTES = "524288"
SNAPSHOT_RECONCILE_BATCH_SIZE = "200"
SNAPSHOT_QUEUE_DAILY_BUDGET = "9000"
AUTH_ENABLED = "false"
AUTH_SITE_URL = "https://example.invalid"
MAIL_FROM = "LTSD <no-reply@example.invalid>"
AUTH_PASSWORD_KEY_VERSION = "1"
AUTH_MAIL_PAYLOAD_KEY_VERSION = "1"
AUTH_MAIL_DAILY_LIMIT = "100"
AUTH_MAIL_MONTHLY_LIMIT = "3000"


[triggers]
crons = ["0 3 * * *", "* * * * *", "*/5 * * * *"]

[[queues.producers]]
binding = "SNAPSHOT_QUEUE"
queue = "lastroweb-snapshot-jobs"

[[queues.consumers]]
queue = "lastroweb-snapshot-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[[queues.producers]]
binding = "MAIL_QUEUE"
queue = "lastroweb-mail-jobs"

[[queues.consumers]]
queue = "lastroweb-mail-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[env.staging]
name = "lastroweb-staging"
vars = { ENVIRONMENT = "staging", MYSQL_CONNECTION_MODE = "hyperdrive", BUILD_VERSION = "staging", MAX_BODY_BYTES = "524288", SNAPSHOT_RECONCILE_BATCH_SIZE = "200", SNAPSHOT_QUEUE_DAILY_BUDGET = "9000", AUTH_ENABLED = "false", AUTH_SITE_URL = "https://example.invalid", MAIL_FROM = "LTSD <no-reply@example.invalid>", AUTH_PASSWORD_KEY_VERSION = "1", AUTH_MAIL_PAYLOAD_KEY_VERSION = "1", AUTH_MAIL_DAILY_LIMIT = "100", AUTH_MAIL_MONTHLY_LIMIT = "3000" }
assets = { directory = "apps/web/dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/making-cookie", "/lastro/presence", "/api/*"] }

# Set a cache-disabled Hyperdrive ID with scripts/configure-hyperdrive.mjs.
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "replace-at-deploy"

[[env.staging.queues.producers]]
binding = "SNAPSHOT_QUEUE"
queue = "lastroweb-staging-snapshot-jobs"

[[env.staging.queues.consumers]]
queue = "lastroweb-staging-snapshot-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[[env.staging.queues.producers]]
binding = "MAIL_QUEUE"
queue = "lastroweb-staging-mail-jobs"

[[env.staging.queues.consumers]]
queue = "lastroweb-staging-mail-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[env.production]
name = "lastroweb-production"
vars = { ENVIRONMENT = "production", MYSQL_CONNECTION_MODE = "hyperdrive", BUILD_VERSION = "production", MAX_BODY_BYTES = "524288", SNAPSHOT_RECONCILE_BATCH_SIZE = "200", SNAPSHOT_QUEUE_DAILY_BUDGET = "9000", IWA_UPDATES_MANIFEST_URL = "https://client.ltsd.ro/updates.json", AUTH_ENABLED = "false", AUTH_SITE_URL = "https://example.invalid", MAIL_FROM = "LTSD <no-reply@example.invalid>", AUTH_PASSWORD_KEY_VERSION = "1", AUTH_MAIL_PAYLOAD_KEY_VERSION = "1", AUTH_MAIL_DAILY_LIMIT = "100", AUTH_MAIL_MONTHLY_LIMIT = "3000" }
assets = { directory = "apps/web/dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/making-cookie", "/lastro/presence", "/api/*"] }

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "replace-at-deploy"

# Cacheable responses (RMS GIF assets, search/history JSON) are served from
# Cloudflare's tiered edge cache without invoking this Worker.
[env.production.cache]
enabled = true

[[env.production.queues.producers]]
binding = "SNAPSHOT_QUEUE"
queue = "lastroweb-production-snapshot-jobs"

[[env.production.queues.consumers]]
queue = "lastroweb-production-snapshot-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[[env.production.queues.producers]]
binding = "MAIL_QUEUE"
queue = "lastroweb-production-mail-jobs"

[[env.production.queues.consumers]]
queue = "lastroweb-production-mail-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[observability.logs]
enabled = true
# Do not log every successful GET/404 invocation.
invocation_logs = false
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01
persist = true

# Set per-environment values explicitly: Wrangler environments do not inherit
# all top-level observability settings.
[env.staging.observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

[env.staging.observability.traces]
enabled = true
head_sampling_rate = 0.01
persist = true

[env.production.observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

[env.production.observability.traces]
enabled = true
head_sampling_rate = 0.01
persist = true
