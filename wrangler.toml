name = "lastroweb"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "local"
BUILD_VERSION = "dev"
MAX_BODY_BYTES = "524288"

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lastroweb-local"
database_id = "local"
migrations_dir = "migrations"

[env.staging]
name = "lastroweb-staging"
vars = { ENVIRONMENT = "staging", BUILD_VERSION = "staging", MAX_BODY_BYTES = "524288" }
[[env.staging.d1_databases]]
binding = "DB"
database_name = "lastroweb-staging"
database_id = "replace-at-deploy"
migrations_dir = "migrations"

[env.production]
name = "lastroweb-production"
vars = { ENVIRONMENT = "production", BUILD_VERSION = "production", MAX_BODY_BYTES = "524288" }
[[env.production.d1_databases]]
binding = "DB"
database_name = "lastroweb-production"
database_id = "replace-at-deploy"
migrations_dir = "migrations"
