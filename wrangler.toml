name = "lastroweb"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "local"
BUILD_VERSION = "dev"
MAX_BODY_BYTES = "524288"
SNAPSHOT_RECONCILE_BATCH_SIZE = "200"
SNAPSHOT_QUEUE_DAILY_BUDGET = "9000"


[triggers]
crons = ["0 3 * * *", "* * * * *", "*/5 * * * *"]

[[queues.producers]]
binding = "SNAPSHOT_QUEUE"
queue = "lastroweb-snapshot-jobs"

[[queues.consumers]]
queue = "lastroweb-snapshot-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[env.staging]
name = "lastroweb-staging"
vars = { ENVIRONMENT = "staging", BUILD_VERSION = "staging", MAX_BODY_BYTES = "524288", SNAPSHOT_RECONCILE_BATCH_SIZE = "200", SNAPSHOT_QUEUE_DAILY_BUDGET = "9000" }
assets = { directory = "apps/web/dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[[env.staging.queues.producers]]
binding = "SNAPSHOT_QUEUE"
queue = "lastroweb-staging-snapshot-jobs"

[[env.staging.queues.consumers]]
queue = "lastroweb-staging-snapshot-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[env.production]
name = "lastroweb-production"
vars = { ENVIRONMENT = "production", BUILD_VERSION = "production", MAX_BODY_BYTES = "524288", SNAPSHOT_RECONCILE_BATCH_SIZE = "200", SNAPSHOT_QUEUE_DAILY_BUDGET = "9000" }
assets = { directory = "apps/web/dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[[env.production.queues.producers]]
binding = "SNAPSHOT_QUEUE"
queue = "lastroweb-production-snapshot-jobs"

[[env.production.queues.consumers]]
queue = "lastroweb-production-snapshot-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

[observability.logs]
enabled = true
invocation_logs = true


[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
