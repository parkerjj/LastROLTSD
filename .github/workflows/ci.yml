name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lastroweb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:migration
      - run: pnpm test:docs

  verify-auth-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.5
        env:
          MYSQL_ROOT_PASSWORD: task14-ci-root-only
          MYSQL_DATABASE: lastroweb_auth_test
          MYSQL_USER: lastroweb_auth_test
          MYSQL_PASSWORD: task14-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --user=root --password=task14-ci-root-only"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      MYSQL_TEST_URL: mysql://lastroweb_auth_test:task14-ci-only@127.0.0.1:3306/lastroweb_auth_test
      AUTH_TEST_DB_ALLOW_RESET: '1'
      REQUIRE_AUTH_MYSQL_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/integration/auth-account-flow.test.ts tests/integration/auth-account-races.test.ts tests/integration/ke-mysql.test.ts --maxWorkers=1 --no-file-parallelism

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, verify-auth-mysql]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - name: Preflight production account auth
        id: auth-preflight
        run: node scripts/preflight-auth-deployment.mjs
        env:
          AUTH_ENABLED_REQUEST: ${{ vars.AUTH_ENABLED }}
          AUTH_SITE_URL: ${{ vars.AUTH_SITE_URL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
          AUTH_PASSWORD_KEY_VERSION: ${{ vars.AUTH_PASSWORD_KEY_VERSION }}
          AUTH_PASSWORD_PREVIOUS_KEY_VERSION: ${{ vars.AUTH_PASSWORD_PREVIOUS_KEY_VERSION }}
          AUTH_MAIL_PAYLOAD_KEY_VERSION: ${{ vars.AUTH_MAIL_PAYLOAD_KEY_VERSION }}
          AUTH_MAIL_PAYLOAD_PREVIOUS_KEY_VERSION: ${{ vars.AUTH_MAIL_PAYLOAD_PREVIOUS_KEY_VERSION }}
          AUTH_MAIL_DAILY_LIMIT: ${{ vars.AUTH_MAIL_DAILY_LIMIT }}
          AUTH_MAIL_MONTHLY_LIMIT: ${{ vars.AUTH_MAIL_MONTHLY_LIMIT }}
          AUTH_PASSWORD_SECRET: ${{ secrets.AUTH_PASSWORD_SECRET }}
          AUTH_PASSWORD_PREVIOUS_SECRET: ${{ secrets.AUTH_PASSWORD_PREVIOUS_SECRET }}
          AUTH_CSRF_SECRET: ${{ secrets.AUTH_CSRF_SECRET }}
          AUTH_RATE_SECRET: ${{ secrets.AUTH_RATE_SECRET }}
          AUTH_MAIL_PAYLOAD_SECRET: ${{ secrets.AUTH_MAIL_PAYLOAD_SECRET }}
          AUTH_MAIL_PAYLOAD_PREVIOUS_SECRET: ${{ secrets.AUTH_MAIL_PAYLOAD_PREVIOUS_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          KE_LICENSE_PRIVATE_KEY: ${{ secrets.KE_LICENSE_PRIVATE_KEY_V1 }}
          KE_CORE_KEY: ${{ secrets.KE_CORE_KEY }}
          KE_BUILD_MANIFEST: ${{ secrets.KE_BUILD_MANIFEST }}
          KE_LICENSE_KEY_VERSION: ${{ vars.KE_LICENSE_KEY_VERSION }}
          KE_CORE_KEY_VERSION: ${{ vars.KE_CORE_KEY_VERSION }}
      - name: Ensure production snapshot Queue exists
        shell: bash
        run: |
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          curl --fail --silent --show-error --get \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-urlencode "name=lastroweb-production-snapshot-jobs" \
            --output "$response"
          jq -e '.success == true and (.result | type == "array")' "$response" > /dev/null
          if ! jq -e 'any(.result[]; .queue_name == "lastroweb-production-snapshot-jobs")' "$response" > /dev/null; then
            pnpm exec wrangler queues create lastroweb-production-snapshot-jobs --env production --config wrangler.toml
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply MySQL schema migrations
        run: pnpm db:mysql:migrate
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
      - name: Check MySQL connectivity
        run: pnpm db:mysql:migrate -- --dry-run
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
      - name: Set Worker MySQL URL secret
        run: node -e "process.stdout.write(process.env.MYSQL_URL)" | pnpm exec wrangler secret put MYSQL_URL --env production --config wrangler.toml
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Worker guestbook rate secret
        run: node -e "process.stdout.write(process.env.GUESTBOOK_RATE_SECRET)" | pnpm exec wrangler secret put GUESTBOOK_RATE_SECRET --env production --config wrangler.toml
        env:
          GUESTBOOK_RATE_SECRET: ${{ secrets.GUESTBOOK_RATE_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Worker Afdian API token secret
        shell: bash
        run: |
          if [ -z "${AFDIAN_TOKEN:-}" ]; then
            echo "::warning::Environment secret AFDIAN_TOKEN is not set; /api/v1/sponsors will return 503 until it is configured."
          else
            node -e "process.stdout.write(process.env.AFDIAN_TOKEN)" | pnpm exec wrangler secret put AFDIAN_TOKEN --env production --config wrangler.toml
          fi
        env:
          AFDIAN_TOKEN: ${{ secrets.AFDIAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Worker Stripe secret key
        shell: bash
        run: |
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::warning::Environment secret STRIPE_SECRET_KEY is not set; Stripe donors will be skipped on /api/v1/sponsors until it is configured."
          else
            node -e "process.stdout.write(process.env.STRIPE_SECRET_KEY)" | pnpm exec wrangler secret put STRIPE_SECRET_KEY --env production --config wrangler.toml
          fi
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish auth-disabled rotation barrier
        if: steps.auth-preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --env production --config wrangler.toml --var "AUTH_ENABLED:false"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Worker account auth secrets
        if: steps.auth-preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name" --env production --config wrangler.toml
            fi
          }
          put_secret AUTH_PASSWORD_SECRET "$AUTH_PASSWORD_SECRET"
          put_secret AUTH_CSRF_SECRET "$AUTH_CSRF_SECRET"
          put_secret AUTH_RATE_SECRET "$AUTH_RATE_SECRET"
          put_secret AUTH_MAIL_PAYLOAD_SECRET "$AUTH_MAIL_PAYLOAD_SECRET"
          put_secret RESEND_API_KEY "$RESEND_API_KEY"
          put_secret AUTH_PASSWORD_PREVIOUS_SECRET "$AUTH_PASSWORD_PREVIOUS_SECRET"
          put_secret AUTH_MAIL_PAYLOAD_PREVIOUS_SECRET "$AUTH_MAIL_PAYLOAD_PREVIOUS_SECRET"
        env:
          AUTH_PASSWORD_SECRET: ${{ secrets.AUTH_PASSWORD_SECRET }}
          AUTH_CSRF_SECRET: ${{ secrets.AUTH_CSRF_SECRET }}
          AUTH_RATE_SECRET: ${{ secrets.AUTH_RATE_SECRET }}
          AUTH_MAIL_PAYLOAD_SECRET: ${{ secrets.AUTH_MAIL_PAYLOAD_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_PASSWORD_PREVIOUS_SECRET: ${{ secrets.AUTH_PASSWORD_PREVIOUS_SECRET }}
          AUTH_MAIL_PAYLOAD_PREVIOUS_SECRET: ${{ secrets.AUTH_MAIL_PAYLOAD_PREVIOUS_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Worker KoreEngine license secrets
        if: steps.auth-preflight.outputs.ke_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name" --env production --config wrangler.toml
            fi
          }
          put_secret KE_LICENSE_PRIVATE_KEY_v1 "$KE_LICENSE_PRIVATE_KEY"
          put_secret KE_CORE_KEY "$KE_CORE_KEY"
          put_secret KE_BUILD_MANIFEST "$KE_BUILD_MANIFEST"
        env:
          KE_LICENSE_PRIVATE_KEY: ${{ secrets.KE_LICENSE_PRIVATE_KEY_V1 }}
          KE_CORE_KEY: ${{ secrets.KE_CORE_KEY }}
          KE_BUILD_MANIFEST: ${{ secrets.KE_BUILD_MANIFEST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production Worker and web assets
        shell: bash
        run: |
          set -euo pipefail
          auth_enabled="$AUTH_ENABLED"
          deploy_args=(--var "AUTH_ENABLED:${auth_enabled}")
          if [[ "$auth_enabled" == 'true' ]]; then
            deploy_args+=(
              --var "AUTH_SITE_URL:${AUTH_SITE_URL}"
              --var "MAIL_FROM:${MAIL_FROM}"
              --var "AUTH_PASSWORD_KEY_VERSION:${AUTH_PASSWORD_KEY_VERSION:-1}"
              --var "AUTH_MAIL_PAYLOAD_KEY_VERSION:${AUTH_MAIL_PAYLOAD_KEY_VERSION:-1}"
              --var "AUTH_MAIL_DAILY_LIMIT:${AUTH_MAIL_DAILY_LIMIT:-100}"
              --var "AUTH_MAIL_MONTHLY_LIMIT:${AUTH_MAIL_MONTHLY_LIMIT:-3000}"
            )
            if [[ -n "${MAIL_REPLY_TO:-}" ]]; then deploy_args+=(--var "MAIL_REPLY_TO:${MAIL_REPLY_TO}"); fi
            if [[ -n "${AUTH_PASSWORD_PREVIOUS_KEY_VERSION:-}" ]]; then
              deploy_args+=(--var "AUTH_PASSWORD_PREVIOUS_KEY_VERSION:${AUTH_PASSWORD_PREVIOUS_KEY_VERSION}")
            fi
            if [[ -n "${AUTH_MAIL_PAYLOAD_PREVIOUS_KEY_VERSION:-}" ]]; then
              deploy_args+=(--var "AUTH_MAIL_PAYLOAD_PREVIOUS_KEY_VERSION:${AUTH_MAIL_PAYLOAD_PREVIOUS_KEY_VERSION}")
            fi
            if [[ -n "${KE_LICENSE_KEY_VERSION:-}" ]]; then deploy_args+=(--var "KE_LICENSE_KEY_VERSION:${KE_LICENSE_KEY_VERSION}"); fi
            if [[ -n "${KE_CORE_KEY_VERSION:-}" ]]; then deploy_args+=(--var "KE_CORE_KEY_VERSION:${KE_CORE_KEY_VERSION}"); fi
          fi
          pnpm exec wrangler deploy --env production --config wrangler.toml "${deploy_args[@]}"
        env:
          AUTH_ENABLED: ${{ steps.auth-preflight.outputs.enabled }}
          AUTH_SITE_URL: ${{ vars.AUTH_SITE_URL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
          AUTH_PASSWORD_KEY_VERSION: ${{ vars.AUTH_PASSWORD_KEY_VERSION }}
          AUTH_PASSWORD_PREVIOUS_KEY_VERSION: ${{ vars.AUTH_PASSWORD_PREVIOUS_KEY_VERSION }}
          AUTH_MAIL_PAYLOAD_KEY_VERSION: ${{ vars.AUTH_MAIL_PAYLOAD_KEY_VERSION }}
          AUTH_MAIL_PAYLOAD_PREVIOUS_KEY_VERSION: ${{ vars.AUTH_MAIL_PAYLOAD_PREVIOUS_KEY_VERSION }}
          AUTH_MAIL_DAILY_LIMIT: ${{ vars.AUTH_MAIL_DAILY_LIMIT }}
          AUTH_MAIL_MONTHLY_LIMIT: ${{ vars.AUTH_MAIL_MONTHLY_LIMIT }}
          KE_LICENSE_KEY_VERSION: ${{ vars.KE_LICENSE_KEY_VERSION }}
          KE_CORE_KEY_VERSION: ${{ vars.KE_CORE_KEY_VERSION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 从「执行迁移」到「新 Worker 上线」之间，旧 Worker 仍可能让用户验证邮箱，这些账号拿不到验证赠送的权益。
      # 新代码上线后补发一次（幂等，可重复执行）。
      - name: Repair signup entitlements
        run: node scripts/backfill-signup-entitlements.mjs
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
