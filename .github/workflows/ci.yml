name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lastroweb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:docs

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - name: Apply MySQL schema migrations
        run: pnpm db:mysql:migrate
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
      - name: Check MySQL connectivity
        run: pnpm db:mysql:migrate -- --dry-run
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
      - name: Set Worker MySQL URL secret
        run: node -e "process.stdout.write(process.env.MYSQL_URL)" | pnpm exec wrangler secret put MYSQL_URL --env production --config wrangler.toml
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Worker guestbook rate secret
        run: node -e "process.stdout.write(process.env.GUESTBOOK_RATE_SECRET)" | pnpm exec wrangler secret put GUESTBOOK_RATE_SECRET --env production --config wrangler.toml
        env:
          GUESTBOOK_RATE_SECRET: ${{ secrets.GUESTBOOK_RATE_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production Worker and web assets
        run: pnpm exec wrangler deploy --env production --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
